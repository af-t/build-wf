name: Build LLVM 23 (cross-compile to arm64)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout LLVM
        uses: actions/checkout@v7
        with:
          repository: llvm/llvm-project
          ref: llvmorg-23.1.2
          fetch-depth: 1

      - name: Install cross-compilation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            python3 \
            build-essential \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            libstdc++-13-dev-arm64-cross \
            linux-libc-dev-arm64-cross \
            qemu-user-static
          # Allow executing freshly built aarch64 binaries on the x86_64
          # runner. Required to build compiler-rt with the just-built
          # clang and to verify the resulting toolchain.
          sudo update-binfmts --enable || true
          qemu-aarch64-static --version

      - name: Build host tools (native x86_64)
        run: |
          cmake -G Ninja \
            -S llvm \
            -B build-host \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            -DLLVM_TARGETS_TO_BUILD="AArch64;ARM" \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DLLVM_BUILD_TOOLS=ON \
            -DLLVM_BUILD_UTILS=ON \
            -DLLVM_INSTALL_TOOLCHAIN_ONLY=OFF
          cmake --build build-host --target llvm-tblgen llvm-min-tblgen clang-tblgen --parallel "$(nproc)"

      - name: Configure cross-compile (arm64)
        run: |
          cmake -G Ninja \
            -S llvm \
            -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install" \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            -DLLVM_ENABLE_RUNTIMES="compiler-rt" \
            -DLLVM_TARGETS_TO_BUILD="AArch64;ARM" \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DLLVM_INSTALL_TOOLCHAIN_ONLY=ON \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DLLVM_DEFAULT_TARGET_TRIPLE=aarch64-linux-gnu \
            -DLLVM_HOST_TRIPLE=aarch64-linux-gnu \
            -DLLVM_ENABLE_LTO=OFF \
            -DLLVM_ENABLE_STACK_PROTECTOR=ON \
            -DLLVM_ENABLE_DEAD_CODE_STRIPPING=ON \
            -DLLVM_TABLEGEN="$GITHUB_WORKSPACE/build-host/bin/llvm-tblgen" \
            -DLLVM_MIN_TABLEGEN="$GITHUB_WORKSPACE/build-host/bin/llvm-min-tblgen" \
            -DCLANG_TABLEGEN="$GITHUB_WORKSPACE/build-host/bin/clang-tblgen"

      - name: Build
        env:
          # Sysroot for running aarch64 binaries under qemu/binfmt
          # during the compiler-rt (builtins) configure step.
          QEMU_LD_PREFIX: /usr/aarch64-linux-gnu
        run: |
          cmake --build build \
            --parallel "$(nproc)"

      - name: Install
        run: |
          cmake --build build --target install

      - name: Verify arm64 binaries
        run: |
          file install/bin/clang
          file install/bin/ld.lld
          file install/bin/clang | grep -q -i aarch64
          # Cross-compiled binaries can't run natively on x86_64,
          # execute them explicitly via qemu with the arm64 sysroot.
          qemu-aarch64-static -L /usr/aarch64-linux-gnu install/bin/clang --version
          qemu-aarch64-static -L /usr/aarch64-linux-gnu install/bin/ld.lld --version

      - name: Package
        run: |
          tar -C install \
            -cJf "$GITHUB_WORKSPACE/clang-llvm-23-aarch64.tar.xz" .

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: clang-llvm-23-aarch64
          path: clang-llvm-23-aarch64.tar.xz
